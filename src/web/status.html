<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aux Bridge Status</title>
<style>
  :root { --bg:#0e0f11; --panel:#17191c; --line:#2a2e33; --text:#e9ebee; --muted:#8b939c;
    --ok:#4cc38a; --bad:#ef5b5b; --accent:#f2a541; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  h1 small { color: var(--muted); font-weight: 500; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .big { font-size: 18px; font-weight: 650; margin-bottom: 6px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 8px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; flex: 1; min-width: 160px; }
  .log { background: #0a0b0c; border: 1px solid var(--line); border-radius: 10px; height: 52vh; overflow: auto;
    font: 12px/1.5 ui-monospace, Consolas, monospace; padding: 8px 10px; }
  .log div { white-space: pre; }
  .t { color: #5d646c; } .d { display: inline-block; width: 15ch; color: var(--accent); }
  .d.console\>bridge { color: #7fb4ff; } .d.ipad\>console { color: #c49bff; } .d.query\>console { color: #5d646c; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aux Bridge <small id="sub">connecting…</small></h1>
  <div class="cards">
    <div class="card"><h2>Console <span class="dot" id="cDot"></span></h2>
      <div class="big" id="cState">—</div><dl id="cInfo"></dl></div>
    <div class="card"><h2>iPad app <span class="dot" id="iDot"></span></h2>
      <div class="big" id="iState">—</div><dl id="iInfo"></dl></div>
    <div class="card"><h2>Web clients <span id="wCount">0</span></h2><dl id="wInfo"></dl></div>
  </div>

  <div class="bar">
    <button id="cap">Capture OSC traffic</button>
    <button id="pause">Pause view</button>
    <button id="clear">Clear</button>
    <button id="resync">Re-sync from console</button>
    <input id="filter" placeholder="Filter, e.g. aux_send or send_level">
  </div>
  <div class="log" id="log"></div>
  <p class="hint">Turn on capture, then move an aux send on the iPad app: the <b>ipad&gt;console</b> lines show the exact
    addresses this console uses. Compare them with <code>paths</code> in config.json.</p>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let ws, capture = false, paused = false, lines = [];
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } } };

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => {
      let pin = store.get('pin') || '';
      ws.send(JSON.stringify({ t: 'hello', role: 'status', pin }));
    };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'auth' && !m.ok) {
        const pin = prompt('PIN');
        try { localStorage.setItem('pin', pin || ''); } catch {}
        ws.send(JSON.stringify({ t: 'hello', role: 'status', pin }));
      } else if (m.t === 'auth' && m.ok && capture) ws.send(JSON.stringify({ t: 'log', on: true }));
      else if (m.t === 'status') status(m);
      else if (m.t === 'logHistory') { lines = m.entries; draw(); }
      else if (m.t === 'log') { lines.push(m.e); if (lines.length > 3000) lines.splice(0, 500); if (!paused) drawSoon(); }
    };
    ws.onclose = () => { $('sub').textContent = 'bridge not reachable'; setTimeout(connect, 1500); };
  }

  const age = ms => ms == null ? 'never' : ms < 1500 ? 'just now' : Math.round(ms / 1000) + ' s ago';
  const dl = (el, rows) => el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function status(s) {
    const up = s.uptime, h = Math.floor(up / 3600), mi = Math.floor(up % 3600 / 60);
    const watched = s.watched.map(w => `${w.aux}${w.name ? ' ' + w.name : ''}${w.clients ? ' (' + w.clients + ')' : ''}`).join(', ');
    $('sub').textContent = `${s.inputCount || '?'} inputs · ${s.auxCount || '?'} auxes · tracking aux ${watched} · up ${h}h ${mi}m`;
    $('cDot').className = 'dot ' + (s.console.connected ? 'ok' : 'bad');
    $('cState').textContent = s.console.connected ? 'Connected' : 'No reply';
    dl($('cInfo'), [['IP', s.console.ip], ['Bridge listens', 'UDP ' + s.console.sendPort], ['Bridge sends to', 'UDP ' + s.console.receivePort],
      ['Last heard', age(s.console.ageMs)], ['Packets in / out', `${s.console.rx} / ${s.console.tx}`], ['Query queue', s.queue]]);
    $('iDot').className = 'dot ' + (!s.ipad.enabled ? '' : s.ipad.connected ? 'ok' : 'bad');
    $('iState').textContent = !s.ipad.enabled ? 'Proxy off' : s.ipad.connected ? 'Connected' : 'Not seen recently';
    dl($('iInfo'), [['iPad IP', s.ipad.ip || 'waiting'], ['Bridge listens', 'UDP ' + s.ipad.sendPort], ['Bridge sends to', 'UDP ' + s.ipad.receivePort],
      ['Last heard', age(s.ipad.ageMs)], ['Packets in / out', `${s.ipad.rx} / ${s.ipad.tx}`]]);
    const mix = s.clients.filter(c => c.role === 'mixer');
    $('wCount').textContent = mix.length;
    dl($('wInfo'), mix.length ? mix.map(c => ['#' + c.id, `${c.ip} · aux ${c.aux}`]) : [['', 'No mixer pages open']]);
  }

  let pend = false;
  function drawSoon() { if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; draw(); }); } }
  function draw() {
    const f = $('filter').value.trim().toLowerCase();
    const shown = (f ? lines.filter(l => (l.address + ' ' + l.dir).toLowerCase().includes(f)) : lines).slice(-600);
    const el = $('log'), atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    el.innerHTML = shown.map(l => `<div><span class="t">${new Date(l.t).toLocaleTimeString()}</span> <span class="d ${l.dir}">${l.dir}</span> ${esc(l.address)} ${esc(l.args)}</div>`).join('');
    if (atEnd) el.scrollTop = el.scrollHeight;
  }

  $('cap').onclick = () => { capture = !capture; $('cap').classList.toggle('on', capture);
    $('cap').textContent = capture ? 'Capturing…' : 'Capture OSC traffic'; ws.send(JSON.stringify({ t: 'log', on: capture })); };
  $('pause').onclick = () => { paused = !paused; $('pause').classList.toggle('on', paused); if (!paused) draw(); };
  $('clear').onclick = () => { lines = []; draw(); };
  $('resync').onclick = () => ws.send(JSON.stringify({ t: 'resync' }));
  $('filter').oninput = draw;
  connect();
})();
</script>
</body>
</html>
